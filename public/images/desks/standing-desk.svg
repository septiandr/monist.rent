<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <!-- consistent 30° top-front angle for entire scene -->
  <!-- desk top surface -->
  <polygon points="100,100 700,100 740,140 60,140" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <!-- desk front face -->
  <polygon points="60,140 740,140 740,155 60,155" fill="#cbd5e1"/>
  <!-- desk legs -->
  <rect x="100" y="155" width="10" height="100" rx="2" fill="#94a3b8"/>
  <rect x="690" y="155" width="10" height="100" rx="2" fill="#94a3b8"/>
  <!-- control panel on desk surface -->
  <rect x="340" y="108" width="120" height="18" rx="5" fill="#0d9488" opacity="0.85"/>
  <text x="400" y="121" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="white" text-anchor="middle">▲ UP ▼ DOWN</text>
  <!-- floor shadow -->
  <ellipse cx="400" cy="270" rx="300" ry="15" fill="#94a3b8" opacity="0.1"/>
</svg>
