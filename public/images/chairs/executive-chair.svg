<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500">
  <!-- same 30° top-front angle -->
  <!-- backrest -->
  <path d="M110,50 Q200,30 290,50 L285,185 Q200,200 115,185 Z" fill="#78350f" stroke="#5a2d0c" stroke-width="2"/>
  <!-- headrest -->
  <path d="M140,40 Q200,25 260,40 L258,75 Q200,85 142,75 Z" fill="#92400e" stroke="#78350f" stroke-width="1.5"/>
  <!-- stitching -->
  <line x1="200" y1="50" x2="200" y2="185" stroke="#a16207" stroke-width="1" stroke-dasharray="4,4"/>
  <!-- seat top surface -->
  <polygon points="100,195 300,195 325,182 75,182" fill="#92400e"/>
  <!-- seat front face -->
  <polygon points="75,182 325,182 325,200 75,200" fill="#78350f"/>
  <!-- armrests -->
  <rect x="72" y="182" width="32" height="10" rx="4" fill="#5a2d0c"/>
  <rect x="296" y="182" width="32" height="10" rx="4" fill="#5a2d0c"/>
  <!-- stem -->
  <rect x="190" y="200" width="20" height="50" rx="4" fill="#44403c"/>
  <!-- base -->
  <ellipse cx="200" cy="290" rx="65" ry="22" fill="none" stroke="#44403c" stroke-width="3"/>
  <!-- wheels -->
  <circle cx="145" cy="300" r="8" fill="#292524"/>
  <circle cx="175" cy="313" r="8" fill="#292524"/>
  <circle cx="225" cy="313" r="8" fill="#292524"/>
  <circle cx="255" cy="300" r="8" fill="#292524"/>
</svg>
