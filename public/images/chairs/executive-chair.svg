<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500" fill="none">
  <defs>
    <linearGradient id="ec-leather" x1="110" y1="30" x2="290" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9a3412"/>
      <stop offset="35%" stop-color="#c2410c"/>
      <stop offset="70%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>
    <linearGradient id="ec-pillow" x1="130" y1="35" x2="270" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="ec-seat" x1="85" y1="185" x2="315" y2="225" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7c2d12"/>
      <stop offset="45%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <linearGradient id="ec-chrome" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="45%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <filter id="ec-shadow" x="80" y="325" width="240" height="60" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="10" result="blur"/>
    </filter>
  </defs>

  <!-- Ambient Floor Shadow -->
  <ellipse cx="200" cy="346" rx="98" ry="14" fill="#451a03" opacity="0.3" filter="url(#ec-shadow)"/>
  <ellipse cx="200" cy="344" rx="72" ry="7" fill="#451a03" opacity="0.38"/>

  <!-- Base Spokes -->
  <line x1="200" y1="294" x2="200" y2="336" stroke="url(#ec-chrome)" stroke-width="6" stroke-linecap="round"/>
  <circle cx="200" cy="338" r="7" fill="#1c1917"/>

  <line x1="200" y1="294" x2="132" y2="316" stroke="url(#ec-chrome)" stroke-width="6" stroke-linecap="round"/>
  <circle cx="132" cy="318" r="7" fill="#1c1917"/>
  <line x1="200" y1="294" x2="268" y2="316" stroke="url(#ec-chrome)" stroke-width="6" stroke-linecap="round"/>
  <circle cx="268" cy="318" r="7" fill="#1c1917"/>

  <line x1="200" y1="294" x2="148" y2="344" stroke="url(#ec-chrome)" stroke-width="7" stroke-linecap="round"/>
  <circle cx="148" cy="346" r="8" fill="#1c1917" stroke="#451a03" stroke-width="2"/>
  <circle cx="148" cy="346" r="4" fill="#78716c"/>

  <line x1="200" y1="294" x2="252" y2="344" stroke="url(#ec-chrome)" stroke-width="7" stroke-linecap="round"/>
  <circle cx="252" cy="346" r="8" fill="#1c1917" stroke="#451a03" stroke-width="2"/>
  <circle cx="252" cy="346" r="4" fill="#78716c"/>

  <!-- Center Hub & Cylinder -->
  <circle cx="200" cy="294" r="14" fill="url(#ec-chrome)"/>
  <rect x="193" y="234" width="14" height="60" rx="3" fill="url(#ec-chrome)"/>

  <!-- Chrome & Leather Armrests -->
  <!-- Left Armrest -->
  <path d="M102 202 L86 202 L86 138 L136 138" stroke="url(#ec-chrome)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <rect x="80" y="132" width="60" height="14" rx="7" fill="#7c2d12" stroke="#ea580c" stroke-width="1"/>

  <!-- Right Armrest -->
  <path d="M298 202 L314 202 L314 138 L264 138" stroke="url(#ec-chrome)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <rect x="260" y="132" width="60" height="14" rx="7" fill="#7c2d12" stroke="#ea580c" stroke-width="1"/>

  <!-- High-Back Contoured Executive Backrest -->
  <path d="M120 32 C160 18, 240 18, 280 32 C295 70, 295 155, 276 195 C240 206, 160 206, 124 195 C105 155, 105 70, 120 32 Z" fill="url(#ec-leather)" stroke="#7c2d12" stroke-width="2"/>

  <!-- Integrated Padded Headrest Pillow -->
  <path d="M136 34 C165 24, 235 24, 264 34 C270 48, 270 72, 262 82 C235 90, 165 90, 138 82 C130 72, 130 48, 136 34 Z" fill="url(#ec-pillow)" stroke="#451a03" stroke-width="1.2"/>

  <!-- Ribbed Horizontal French Stitching Channels -->
  <!-- Channel 1 -->
  <path d="M126 94 C165 102, 235 102, 274 94" stroke="#451a03" stroke-width="2.5" fill="none"/>
  <path d="M126 95 C165 103, 235 103, 274 95" stroke="#fde047" stroke-width="1" stroke-dasharray="3,3" fill="none" opacity="0.6"/>
  <!-- Channel 2 -->
  <path d="M124 128 C165 137, 235 137, 276 128" stroke="#451a03" stroke-width="2.5" fill="none"/>
  <path d="M124 129 C165 138, 235 138, 276 129" stroke="#fde047" stroke-width="1" stroke-dasharray="3,3" fill="none" opacity="0.6"/>
  <!-- Channel 3 -->
  <path d="M124 162 C165 172, 235 172, 276 162" stroke="#451a03" stroke-width="2.5" fill="none"/>
  <path d="M124 163 C165 173, 235 173, 276 163" stroke="#fde047" stroke-width="1" stroke-dasharray="3,3" fill="none" opacity="0.6"/>

  <!-- Thick Cushioned Cognac Leather Seat -->
  <path d="M98 192 C150 180, 250 180, 302 192 C324 202, 326 218, 302 228 C250 238, 150 238, 98 228 C76 218, 78 202, 98 192 Z" fill="url(#ec-seat)" stroke="#7c2d12" stroke-width="1.5"/>
  <!-- Seat Stitching & Inset -->
  <path d="M100 228 C150 240, 250 240, 300 228 L296 238 C250 250, 150 250, 104 238 Z" fill="#451a03"/>
</svg>
