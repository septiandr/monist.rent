<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500">
  <!-- same 30° top-front angle -->
  <!-- backrest -->
  <path d="M120,60 Q200,40 280,60 L275,170 Q200,182 125,170 Z" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <!-- mesh lines -->
  <line x1="150" y1="75" x2="150" y2="165" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="175" y1="65" x2="175" y2="170" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="200" y1="60" x2="200" y2="173" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="225" y1="65" x2="225" y2="170" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="250" y1="75" x2="250" y2="165" stroke="#cbd5e1" stroke-width="1"/>
  <!-- seat top surface -->
  <polygon points="105,185 295,185 320,172 80,172" fill="#94a3b8"/>
  <!-- seat front face -->
  <polygon points="80,172 320,172 320,190 80,190" fill="#64748b"/>
  <!-- armrests -->
  <rect x="78" y="170" width="30" height="8" rx="3" fill="#475569"/>
  <rect x="292" y="170" width="30" height="8" rx="3" fill="#475569"/>
  <!-- stem -->
  <rect x="190" y="190" width="20" height="50" rx="4" fill="#64748b"/>
  <!-- base -->
  <ellipse cx="200" cy="275" rx="65" ry="22" fill="none" stroke="#64748b" stroke-width="3"/>
  <!-- wheels -->
  <circle cx="145" cy="285" r="8" fill="#334155"/>
  <circle cx="175" cy="298" r="8" fill="#334155"/>
  <circle cx="225" cy="298" r="8" fill="#334155"/>
  <circle cx="255" cy="285" r="8" fill="#334155"/>
</svg>
