  <path d="M100 45 C102 85, 115 130, 100 174" stroke="#fde047" stroke-width="1" stroke-dasharray="3,3" fill="none" opacity="0.6"/>

  <path d="M60 120 C75 140, 95 145, 120 142" stroke="#9a3412" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5"/>
  <path d="M48 145 C65 156, 85 160, 100 162" stroke="#9a3412" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5"/>

  <!-- Fabric Indentation Highlight (Soft Plump Seat) -->
