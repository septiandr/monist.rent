<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="bb-linen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fdba74"/>
      <stop offset="45%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="bb-shadow" x="20" y="140" width="160" height="40" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="8" result="blur"/>
    </filter>
  </defs>

  <ellipse cx="100" cy="165" rx="68" ry="14" fill="#431407" opacity="0.3" filter="url(#bb-shadow)"/>

  <!-- Linen Fabric Carry Loop Handle -->
  <path d="M92 48 Q100 32 108 48" stroke="#7c2d12" stroke-width="6" stroke-linecap="round" fill="none"/>

  <!-- Ergonomic Teardrop Lounger Bean Bag Body -->
  <path d="M100 45 C122 55, 155 95, 162 135 C168 160, 145 174, 100 174 C55 174, 32 160, 38 135 C45 95, 78 55, 100 45 Z" fill="url(#bb-linen)" stroke="#9a3412" stroke-width="1.8"/>

  <!-- Double French Stitch Seams (Creases and Folds) -->
