<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <!-- box (front-top perspective) -->
  <polygon points="20,45 100,45 95,95 25,95" fill="#78716c"/>
  <polygon points="20,45 100,45 105,38 15,38" fill="#a8a29e"/>
  <!-- lid slightly open -->
  <polygon points="18,38 102,38 106,32 14,32" fill="#d6d3d1" opacity="0.5"/>
  <!-- handle -->
  <rect x="50" y="40" width="20" height="5" rx="2" fill="#57534e"/>
  <!-- latch -->
  <rect x="55" y="44" width="10" height="8" rx="1" fill="#44403c"/>
</svg>
