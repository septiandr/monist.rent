<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="fc-woven" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="50%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#115e59"/>
    </linearGradient>
    <filter id="fc-shadow" x="20" y="130" width="160" height="40" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="8" result="blur"/>
    </filter>
  </defs>

  <ellipse cx="100" cy="155" rx="68" ry="14" fill="#042f2e" opacity="0.3" filter="url(#fc-shadow)"/>

  <!-- Lower Base Cylinder / Skirt -->
  <path d="M42 128 C42 144, 158 144, 158 128 L158 142 C158 158, 42 158, 42 142 Z" fill="#134e4a"/>

  <!-- Round Floor Pouf / Meditation Cushion Body -->
  <ellipse cx="100" cy="126" rx="58" ry="24" fill="url(#fc-woven)" stroke="#115e59" stroke-width="1.8"/>

  <!-- Radial Tufting / French Button Detailing -->
  <circle cx="100" cy="126" r="6" fill="#042f2e" stroke="#5eead4" stroke-width="1.5"/>
  <circle cx="100" cy="126" r="2.5" fill="#f0fdfa"/>

  <!-- Tuft Pinch Lines radiating outwards -->
  <path d="M100 120 C96 112, 85 108, 68 112" stroke="#134e4a" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M100 132 C96 140, 85 144, 68 140" stroke="#134e4a" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M106 126 C115 124, 130 120, 148 124" stroke="#134e4a" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M94 126 C85 128, 70 132, 52 128" stroke="#134e4a" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M104 122 C115 114, 126 112, 138 114" stroke="#134e4a" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M104 130 C115 138, 126 140, 138 138" stroke="#134e4a" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Bohemian Top Edge Highlight -->
  <ellipse cx="100" cy="124" rx="46" ry="18" fill="#5eead4" opacity="0.15"/>
</svg>
