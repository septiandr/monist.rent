<svg xmlns="http://www.w3.org/2000/svg" width="340" height="240" viewBox="0 0 340 240" fill="none">
  <defs>
    <linearGradient id="dm-bezel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="dm-screen1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#172033"/>
    </linearGradient>
    <linearGradient id="dm-screen2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="dm-arm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="dm-glow" x="10" y="20" width="320" height="150" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="8" result="blur"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <rect x="20" y="30" width="140" height="110" rx="10" fill="#0d9488" opacity="0.18" filter="url(#dm-glow)"/>
  <rect x="180" y="30" width="140" height="110" rx="10" fill="#f97316" opacity="0.15" filter="url(#dm-glow)"/>

  <!-- Heavy-Duty Dual Monitor Desk Clamp & Arms -->
  <rect x="156" y="176" width="28" height="36" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <rect x="150" y="208" width="40" height="10" rx="3" fill="#1e293b"/>
  <!-- Clamp Knob -->
  <circle cx="170" cy="224" r="5" fill="#475569"/>

  <!-- Left Arm Extender -->
  <path d="M168 185 L96 150 L96 100" stroke="url(#dm-arm)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="96" cy="150" r="7" fill="#0f172a" stroke="#64748b" stroke-width="2"/>

  <!-- Right Arm Extender -->
  <path d="M172 185 L244 150 L244 100" stroke="url(#dm-arm)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="244" cy="150" r="7" fill="#0f172a" stroke="#64748b" stroke-width="2"/>

  <!-- LEFT MONITOR (Angled slightly inward) -->
  <polygon points="16,34 162,38 162,142 16,138" fill="url(#dm-bezel)" stroke="#334155" stroke-width="1.8"/>
  <polygon points="20,38 158,42 158,138 20,134" fill="url(#dm-screen1)"/>

  <!-- Left Screen UI (Code Editor) -->
  <rect x="25" y="44" width="128" height="10" rx="2" fill="#1e293b" opacity="0.9"/>
  <circle cx="31" cy="49" r="2" fill="#ef4444"/>
  <circle cx="37" cy="49" r="2" fill="#f59e0b"/>
  <circle cx="43" cy="49" r="2" fill="#10b981"/>
  <text x="90" y="51" font-family="system-ui" font-size="5.5" font-weight="600" fill="#94a3b8" text-anchor="middle">terminal • zsh</text>

  <text x="30" y="66" font-family="monospace" font-size="5.5" fill="#a3e635">$ npm run build</text>
  <text x="30" y="76" font-family="monospace" font-size="5" fill="#2dd4bf">✓ Compiled successfully</text>
  <text x="30" y="85" font-family="monospace" font-size="5" fill="#94a3b8">Route (app)   Size: 142 kB</text>

  <rect x="30" y="92" width="120" height="36" rx="2" fill="#090d16" opacity="0.6"/>
  <line x1="36" y1="102" x2="135" y2="102" stroke="#0d9488" stroke-width="2" stroke-linecap="round"/>
  <line x1="36" y1="110" x2="110" y2="110" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <line x1="36" y1="118" x2="125" y2="118" stroke="#f43f5e" stroke-width="2" stroke-linecap="round"/>

  <!-- RIGHT MONITOR (Angled slightly inward) -->
  <polygon points="178,38 324,34 324,138 178,142" fill="url(#dm-bezel)" stroke="#334155" stroke-width="1.8"/>
  <polygon points="182,42 320,38 320,134 182,138" fill="url(#dm-screen2)"/>

  <!-- Right Screen UI (Browser / Figma / Dashboard) -->
  <rect x="187" y="44" width="128" height="10" rx="2" fill="#1e293b" opacity="0.9"/>
  <circle cx="193" cy="49" r="2" fill="#ef4444"/>
  <circle cx="199" cy="49" r="2" fill="#f59e0b"/>
  <circle cx="205" cy="49" r="2" fill="#10b981"/>
  <rect x="214" y="46" width="70" height="6" rx="2" fill="#0f172a"/>
  <text x="249" y="51" font-family="system-ui" font-size="5" fill="#94a3b8" text-anchor="middle">monis.rent/preview</text>

  <!-- Right Screen Visual Card Mockups -->
  <rect x="190" y="60" width="58" height="66" rx="3" fill="#0d9488" opacity="0.25"/>
  <rect x="194" y="64" width="50" height="28" rx="2" fill="#0d9488" opacity="0.6"/>
  <line x1="196" y1="98" x2="238" y2="98" stroke="#5eead4" stroke-width="2" stroke-linecap="round"/>
  <line x1="196" y1="106" x2="228" y2="106" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>

  <rect x="254" y="60" width="58" height="66" rx="3" fill="#f97316" opacity="0.2"/>
  <circle cx="283" cy="80" r="14" fill="#f97316" opacity="0.7"/>
  <line x1="260" y1="102" x2="304" y2="102" stroke="#fdba74" stroke-width="2" stroke-linecap="round"/>
  <line x1="260" y1="110" x2="294" y2="110" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
</svg>
