<svg xmlns="http://www.w3.org/2000/svg" width="220" height="260" viewBox="0 0 220 260" fill="none">
  <defs>
    <linearGradient id="dl-cone" x1="120" y1="45" x2="60" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#fde047" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="dl-metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="dl-brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="dl-glow" x="20" y="20" width="180" height="230" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="12" result="blur"/>
    </filter>
  </defs>

  <!-- Ambient Light Cone Glow -->
  <polygon points="120,48 145,55 20,240 180,240" fill="url(#dl-cone)" filter="url(#dl-glow)"/>
  <polygon points="120,48 145,55 35,230 165,230" fill="url(#dl-cone)" opacity="0.65"/>

  <!-- Clamp on Desk Edge (Lower Right) -->
  <rect x="174" y="200" width="18" height="30" rx="3" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <rect x="168" y="222" width="28" height="8" rx="2" fill="#1e293b"/>
  <circle cx="182" cy="236" r="4.5" fill="url(#dl-brass)"/>

  <!-- Lower Arm (Matte Black Tubular Alloy) -->
  <line x1="182" y1="205" x2="165" y2="120" stroke="url(#dl-metal)" stroke-width="6" stroke-linecap="round"/>
  <!-- Tension Springs -->
  <line x1="184" y1="195" x2="168" y2="135" stroke="#64748b" stroke-width="1.5" stroke-dasharray="2,2"/>

  <!-- Elbow Joint (Brass Pivot) -->
  <circle cx="165" cy="120" r="7" fill="url(#dl-brass)" stroke="#78350f" stroke-width="1"/>
  <circle cx="165" cy="120" r="3" fill="#0f172a"/>

  <!-- Upper Arm -->
  <line x1="165" y1="120" x2="130" y2="48" stroke="url(#dl-metal)" stroke-width="6" stroke-linecap="round"/>

  <!-- Head Swivel Joint -->
  <circle cx="130" cy="48" r="6" fill="url(#dl-brass)"/>

  <!-- Lamp Shade (Conical Architectural Hood) -->
  <path d="M105 52 L142 36 L154 52 L116 68 Z" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <ellipse cx="132" cy="52" rx="22" ry="10" transform="rotate(-25 132 52)" fill="#1e293b"/>

  <!-- Warm LED Emitter Lens & Radiant Glow -->
  <ellipse cx="128" cy="54" rx="16" ry="7" transform="rotate(-25 128 54)" fill="#fef08a"/>
  <ellipse cx="128" cy="54" rx="10" ry="4" transform="rotate(-25 128 54)" fill="#ffffff"/>
  <circle cx="128" cy="54" r="14" fill="#fde047" opacity="0.5"/>
</svg>
