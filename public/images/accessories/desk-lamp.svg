<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- same 30° top-front angle -->
  <!-- lamp head (ellipse, top very visible) -->
  <ellipse cx="100" cy="28" rx="40" ry="18" fill="#fbbf24"/>
  <ellipse cx="100" cy="28" rx="30" ry="13" fill="#f59e0b"/>
  <!-- light cone -->
  <polygon points="68,42 132,42 148,95 52,95" fill="#fbbf24" opacity="0.1"/>
  <!-- arm -->
  <line x1="100" y1="46" x2="100" y2="115" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
  <!-- base (ellipse from above) -->
  <ellipse cx="100" cy="130" rx="30" ry="10" fill="#94a3b8"/>
  <rect x="85" y="115" width="30" height="15" rx="3" fill="#64748b"/>
</svg>
