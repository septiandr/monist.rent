<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- lamp head (front-top view, angled) -->
  <ellipse cx="100" cy="35" rx="35" ry="14" fill="#fbbf24"/>
  <ellipse cx="100" cy="35" rx="25" ry="10" fill="#f59e0b"/>
  <!-- light cone -->
  <polygon points="80,45 120,45 140,100 60,100" fill="#fbbf24" opacity="0.15"/>
  <!-- arm (angled from front-top) -->
  <line x1="100" y1="49" x2="100" y2="120" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
  <!-- base -->
  <ellipse cx="100" cy="135" rx="25" ry="8" fill="#94a3b8"/>
  <rect x="88" y="120" width="24" height="15" rx="3" fill="#64748b"/>
</svg>
