  <ellipse cx="80" cy="60" rx="22" ry="28" fill="#22c55e" opacity="0.65"/>
  <ellipse cx="120" cy="65" rx="18" ry="24" fill="#16a34a" opacity="0.6"/>
  <ellipse cx="100" cy="45" rx="17" ry="22" fill="#15803d" opacity="0.55"/>
  <ellipse cx="75" cy="82" rx="15" ry="18" fill="#22c55e" opacity="0.4"/>
