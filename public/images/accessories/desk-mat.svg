<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- desk mat (perspective - parallelogram) -->
  <polygon points="15,75 185,75 195,65 5,65" fill="#334155" opacity="0.85"/>
  <polygon points="15,75 185,75 185,95 15,95" fill="#1e293b" opacity="0.8"/>
  <!-- edge stitching -->
  <line x1="20" y1="70" x2="180" y2="70" stroke="#475569" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="20" y1="90" x2="180" y2="90" stroke="#475569" stroke-width="1" stroke-dasharray="3,3"/>
  <!-- shadow -->
  <ellipse cx="100" cy="105" rx="80" ry="6" fill="#334155" opacity="0.1"/>
</svg>
