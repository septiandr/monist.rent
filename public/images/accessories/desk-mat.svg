<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- same 30° top-front angle -->
  <!-- mat top surface (wide parallelogram) -->
  <polygon points="5,78 195,78 205,65 -5,65" fill="#334155" opacity="0.85"/>
  <!-- mat front face -->
  <polygon points="-5,65 205,65 205,80 -5,80" fill="#1e293b" opacity="0.75"/>
  <!-- edge stitching -->
  <line x1="0" y1="70" x2="200" y2="70" stroke="#475569" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="0" y1="77" x2="200" y2="77" stroke="#475569" stroke-width="1" stroke-dasharray="3,3"/>
  <!-- shadow -->
  <ellipse cx="100" cy="90" rx="90" ry="6" fill="#334155" opacity="0.06"/>
</svg>
