<svg xmlns="http://www.w3.org/2000/svg" width="360" height="140" viewBox="0 0 360 140" fill="none">
  <defs>
    <linearGradient id="dm-felt" x1="50" y1="20" x2="310" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="dm-tag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <filter id="dm-shadow" x="20" y="20" width="320" height="110" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="6" result="blur"/>
    </filter>
  </defs>

  <!-- Ambient Mat Drop Shadow on Desk -->
  <polygon points="52,32 308,32 334,106 26,106" fill="#020617" opacity="0.3" filter="url(#dm-shadow)"/>

  <!-- Wool Felt Mat Base (30° Isometric Perspective) -->
  <polygon points="50,30 310,30 336,104 24,104" fill="url(#dm-felt)" stroke="#475569" stroke-width="1.5"/>

  <!-- Precision Edge Perimeter Stitching -->
  <polygon points="55,34 305,34 329,100 31,100" stroke="#64748b" stroke-width="0.8" stroke-dasharray="3,3" fill="none"/>

  <!-- Subtle Felt Texture Lines -->
  <line x1="70" y1="42" x2="290" y2="42" stroke="#475569" stroke-width="0.5" opacity="0.4"/>
  <line x1="50" y1="62" x2="310" y2="62" stroke="#475569" stroke-width="0.5" opacity="0.3"/>
  <line x1="38" y1="84" x2="322" y2="84" stroke="#475569" stroke-width="0.5" opacity="0.3"/>

  <!-- Embossed Vegan Leather Logo Badge (Top Right Corner) -->
  <polygon points="274,38 300,38 303,48 277,48" fill="url(#dm-tag)" stroke="#451a03" stroke-width="0.8"/>
  <text x="289" y="45" font-family="system-ui" font-size="4" font-weight="800" fill="#fde68a" text-anchor="middle">MONIS</text>

  <!-- Keyboard / Mouse Rest Guide Shadows -->
  <ellipse cx="180" cy="72" rx="70" ry="12" fill="#0f172a" opacity="0.25"/>
  <ellipse cx="270" cy="74" rx="16" ry="10" fill="#0f172a" opacity="0.2"/>
</svg>
